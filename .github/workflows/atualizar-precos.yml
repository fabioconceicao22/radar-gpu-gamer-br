name: Atualizar preços das GPUs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10,22 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-precos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Pesquisar links e preços
        run: python coletar_precos.py

      - name: Publicar resultados atualizados
        run: |
          if git diff --quiet -- data/precos_coletados.csv; then
            echo "Nenhuma alteração nos preços."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precos_coletados.csv
          git commit -m "chore: atualizar preços coletados"
          git push

